<header><h1>ICTL 7-Day Challenge</h1><div class="subtitle">كورس مكثف — شرح طويل + 50 سؤال يوميًا + اختبار نهائي</div></header>

<script>
const DAYS=[{"title": "اليوم 1 — أساسيات الكمبيوتر", "en": "Computer Fundamentals", "sections": [["1) ما هو الكمبيوتر؟", "الكمبيوتر جهاز إلكتروني يستقبل البيانات، يعالجها وفق تعليمات، ثم ينتج معلومات يمكن استخدامها أو تخزينها. الفكرة الأساسية هي Input → Processing → Output → Storage. مثال: عندما تكتب إجابة في لوحة المفاتيح فهذا إدخال، يعالج المعالج الأمر، تظهر النتيجة على الشاشة كإخراج، ويمكن حفظها في ملف كتخزين."], ["2) Hardware وSoftware", "Hardware هو كل ما تستطيع لمسه: Motherboard، CPU، RAM، SSD، شاشة، لوحة مفاتيح، فأرة، طابعة وغيرها. Software هو البرامج والتعليمات: Windows، المتصفح، Word، Excel، الألعاب والتطبيقات. الجهاز لا يعمل بشكل مفيد بدون تعاون الاثنين."], ["3) CPU بالتفصيل", "CPU هو وحدة المعالجة المركزية. ينفذ التعليمات ويجري العمليات الحسابية والمنطقية. من المفاهيم المرتبطة به Control Unit وALU وRegisters. لا تحفظ أسماء الأجزاء فقط؛ افهم أن المعالج ينفذ التعليمات، بينما RAM توفر مساحة عمل سريعة للبيانات التي تحتاجها البرامج أثناء التشغيل."], ["4) RAM وROM والتخزين", "RAM ذاكرة عمل مؤقتة وسريعة، وتفقد محتواها عادة عند إيقاف الطاقة. التخزين مثل SSD/HDD يحتفظ بالملفات. ROM مصطلح يشير إلى ذاكرة غير متطايرة تستخدم لتخزين تعليمات ثابتة أو Firmware في بعض الأنظمة. في الامتحان، كلمة «مؤقت» غالبًا تشير إلى RAM، وكلمة «يحتفظ بالملفات بعد إغلاق الجهاز» تشير إلى Storage."], ["5) Motherboard وGPU", "Motherboard هي اللوحة الرئيسية التي تربط مكونات الجهاز ببعضها. GPU متخصص في معالجة الرسوميات والصور والفيديو، ويمكن أن يكون مدمجًا أو منفصلًا. لا تخلط بين CPU وGPU: كلاهما يعالج، لكن GPU مصمم بكفاءة عالية للعمليات المتوازية والرسوميات."], ["6) أجهزة الإدخال والإخراج", "Keyboard وMouse وScanner وMicrophone أمثلة على Input. Monitor وPrinter وSpeakers أمثلة على Output. Touchscreen يمكن أن تكون Input وOutput معًا لأنها تعرض المعلومات وتستقبل اللمس."], ["7) نظام التشغيل", "Operating System مثل Windows هو الوسيط الأساسي بين المستخدم والعتاد والبرامج. يدير الملفات والذاكرة والعمليات والأجهزة والحسابات والشبكات. من دون نظام تشغيل يصبح تشغيل التطبيقات والتعامل مع الجهاز أكثر تعقيدًا."], ["8) الملفات والمجلدات", "File هو عنصر يحتوي بيانات، وFolder يساعدك على تنظيم الملفات. امتداد الملف يعطي فكرة عن نوعه: DOCX، XLSX، PPTX، PDF، JPG، PNG، MP3، MP4. تغيير اسم الامتداد يدويًا لا يحول الملف الحقيقي من نوع إلى آخر."], ["9) الاختصارات الأساسية", "Ctrl+C نسخ، Ctrl+X قص، Ctrl+V لصق، Ctrl+Z تراجع، Ctrl+Y إعادة، Ctrl+S حفظ، Ctrl+F بحث، Ctrl+A تحديد الكل، Ctrl+P طباعة، Alt+Tab تبديل النوافذ. الاختصارات مهمة لأنها توفر الوقت وتظهر كثيرًا في أسئلة المهارات العملية."], ["10) كيف تفكر في الامتحان", "إذا سأل السؤال عن «ذاكرة مؤقتة» فكر في RAM. عن «تنفيذ التعليمات» فكر في CPU. عن «حفظ الملفات» فكر في Storage. عن «إدارة الجهاز والبرامج» فكر في Operating System. لا تختار الإجابة لمجرد تشابه الكلمات؛ اربط المصطلح بوظيفته."]]}, {"title": "اليوم 2 — Windows وإدارة الملفات", "en": "Windows & File Management", "sections": [["1) واجهة Windows", "Desktop هو سطح العمل، Taskbar شريط المهام، Start يفتح التطبيقات والإعدادات، وFile Explorer لإدارة الملفات. النوافذ يمكن تصغيرها وتكبيرها وإغلاقها وتحريكها."], ["2) File Explorer", "من خلال File Explorer يمكنك الوصول إلى Desktop وDocuments وDownloads وPictures وغيرها. تعلم التنقل في المسارات، إنشاء المجلدات، تحديد أكثر من ملف، والبحث داخل المجلدات."], ["3) Copy وCut وPaste", "Copy ينشئ نسخة ويترك الأصل. Cut يجهز العنصر للنقل. Paste يضع المحتوى في المكان الجديد. من الأخطاء الشائعة استخدام Cut عندما تريد الاحتفاظ بنسخة من الملف."], ["4) Delete وRecycle Bin", "عند حذف ملف بالطريقة المعتادة قد ينتقل إلى Recycle Bin. يمكنك Restore لاستعادته إلى مكانه، أو Empty Recycle Bin لحذف المحتوى نهائيًا. لا تفترض أن الملف المحذوف من السلة يمكن استعادته بسهولة."], ["5) Rename وSave As", "Rename يغير اسم العنصر. Save As يسمح باختيار اسم ومكان وصيغة للحفظ. إذا أردت إنشاء نسخة جديدة مع الاحتفاظ بالأصل، Save As أفضل من Rename."], ["6) الامتدادات", "DOCX مستند Word، XLSX ملف Excel، PPTX عرض PowerPoint، PDF مستند ثابت، JPG/PNG صور، ZIP أرشيف مضغوط. معرفة الامتدادات تساعدك في اختيار البرنامج المناسب."], ["7) ضغط الملفات", "ZIP يجمع ملفات ومجلدات في حزمة واحدة وقد يقلل الحجم. فك الضغط Extract يعيد الملفات إلى شكلها المعتاد. الضغط لا يعني تشفيرًا تلقائيًا؛ ملف ZIP ليس آمنًا لمجرد أنه مضغوط."], ["8) النسخ الاحتياطي والسحابة", "Backup نسخة هدفها استعادة البيانات عند فقدها. Cloud Sync يزامن الملفات بين أجهزة أو خدمات. المزامنة ليست دائمًا بديلًا عن النسخ الاحتياطي لأن حذف الملف قد يتزامن أيضًا."], ["9) إعدادات Windows والتحديثات", "راجع الشبكة والصوت والشاشة واللغة والحسابات والتحديثات. التحديثات تصلح أخطاء وقد تغلق ثغرات أمنية. تجنب تعطيل التحديثات دون سبب."], ["10) Troubleshooting في Windows", "عند توقف برنامج: انتظر قليلًا، حاول حفظ العمل، أغلق البرنامج بأمان، ثم استخدم Task Manager عند الحاجة. لا تبدأ بحذف ملفات النظام. حدّد المشكلة أولًا ثم جرّب الحل الأقل خطورة."]]}, {"title": "اليوم 3 — الإنترنت والشبكات", "en": "Internet, Web, Email & Networks", "sections": [["1) Internet أم Web؟", "Internet هو البنية العالمية للشبكات المتصلة. Web هو خدمة تعمل فوق الإنترنت وتضم المواقع وصفحات الويب. البريد الإلكتروني وخدمات أخرى تستخدم الإنترنت لكنها ليست هي الويب نفسه."], ["2) Browser ومحرك البحث", "Browser مثل Chrome أو Edge يفتح صفحات الويب. Search Engine مثل Google يساعدك على العثور على صفحات ومعلومات. المتصفح ليس هو محرك البحث."], ["3) URL وDomain", "URL هو العنوان الكامل لمورد على الويب. Domain هو اسم النطاق، مثل الجزء الذي يحدد الموقع. انتبه للنطاقات المزيفة التي تشبه أسماء الشركات."], ["4) HTTP وHTTPS", "HTTPS يستخدم تشفيرًا لحماية البيانات أثناء انتقالها بين المتصفح والخادم. وجود HTTPS مهم لكنه لا يثبت وحده أن الموقع صادق؛ افحص اسم النطاق والمصدر."], ["5) البحث الذكي", "ابدأ بكلمات مفتاحية واضحة، أضف كلمة تحدد الموضوع، واستخدم نتائج من مصادر موثوقة. قارن المعلومات ولا تعتمد على أول نتيجة فقط. انتبه إلى تاريخ المقال والجهة التي نشرته."], ["6) البريد الإلكتروني", "To للمستلم الأساسي، CC لنسخة ظاهرة، BCC لنسخة مخفية عن بقية المستلمين. Subject عنوان الرسالة. Attachment ملف مرفق. لا تفتح مرفقات مجهولة."], ["7) Router وWi‑Fi وLAN", "Router يوجه البيانات بين الشبكات ويوفر الاتصال للأجهزة. Wi‑Fi وسيلة اتصال لاسلكية. LAN شبكة محلية داخل منزل أو مدرسة أو مكتب. IP Address عنوان منطقي على الشبكة."], ["8) Download وUpload", "Download نقل بيانات من الإنترنت إلى جهازك. Upload نقل بيانات من جهازك إلى خدمة أو موقع. رفع صورة إلى موقع Upload، وتنزيل ملف من موقع Download."], ["9) الشبكات العامة", "في Wi‑Fi عام لا تتعامل مع الشبكة كأنها آمنة تلقائيًا. استخدم HTTPS، وتجنب إدخال بيانات شديدة الحساسية في مواقع غير موثوقة، وأوقف المشاركة غير الضرورية."], ["10) مهارات الإنترنت في الامتحان", "إذا كان السؤال عن العثور على المعلومات ففكر Search Engine. عن فتح الموقع فكر Browser. عن عنوان الموقع فكر URL. عن إخفاء مستلمي البريد فكر BCC. عن توجيه البيانات فكر Router."]]}, {"title": "اليوم 4 — Word وPowerPoint", "en": "Word & PowerPoint", "sections": [["1) Word ووظيفته", "Word برنامج لمعالجة النصوص وإنشاء المستندات. استخدمه للتقارير والخطابات والواجبات والجداول البسيطة."], ["2) تنسيق النص", "Font وFont Size وBold وItalic وUnderline وText Color تغير مظهر النص. Alignment يحدد المحاذاة. Line Spacing يضبط المسافة بين السطور."], ["3) Paragraphs والقوائم", "الفقرات تنظم الأفكار. Bullets للقوائم غير المرتبة وNumbering للقوائم المرتبة. استخدم العناوين بدل تكبير النص يدويًا فقط."], ["4) Styles وTable of Contents", "Styles توفر تنسيقًا موحدًا للعناوين. عند استخدام Heading 1 وHeading 2 بصورة صحيحة يصبح إنشاء جدول محتويات أسهل."], ["5) الصور والجداول", "Insert Picture لإضافة صورة، وInsert Table لإضافة جدول. Wrap Text يتحكم في علاقة النص بالصورة. استخدم الصور التي تخدم الفكرة ولا تزدحم الصفحة."], ["6) Find وReplace والتدقيق", "Find يبحث عن كلمة أو عبارة، Replace يستبدلها. التدقيق الإملائي يساعد في اكتشاف بعض الأخطاء، لكنه لا يفهم المعنى دائمًا."], ["7) Page Layout", "Margins للهوامش، Orientation لاتجاه الصفحة، Size لحجم الورق. Header وFooter لمعلومات تتكرر أعلى أو أسفل الصفحات."], ["8) Save وPDF", "Save يحفظ التعديلات، Save As ينشئ نسخة باسم أو صيغة أخرى. PDF مفيد عند مشاركة مستند تريد الحفاظ على شكله."], ["9) PowerPoint", "PowerPoint يعتمد على Slides. لكل شريحة فكرة رئيسية. استخدم عنوانًا واضحًا ونصًا مختصرًا وصورة أو مخططًا عند الحاجة."], ["10) Transitions وAnimations", "Transition انتقال من شريحة إلى أخرى. Animation حركة لعنصر داخل الشريحة. الإفراط في المؤثرات يشتت الجمهور؛ استخدمها لخدمة المحتوى."], ["11) تصميم العرض", "اختر خطًا واضحًا وتباينًا جيدًا، وابتعد عن الفقرات الطويلة. العرض الجيد يساعد المتحدث بدل أن يكون صفحة كتاب على الشاشة."], ["12) أسئلة الامتحان", "إذا كان المطلوب مستندًا فكر Word. عرض شرائح فكر PowerPoint. البحث عن نص Find. استبدال نص Replace. حركة بين الشرائح Transition. حركة عنصر Animation."]]}, {"title": "اليوم 5 — Excel والبيانات", "en": "Excel, Formulas & Charts", "sections": [["1) Workbook وWorksheet", "Workbook هو ملف Excel، وWorksheet ورقة داخله. الصفوف Rows مرقمة، والأعمدة Columns تحمل حروفًا. تقاطعها Cell."], ["2) الخلية والنطاق", "A1 خلية في العمود A والصف 1. A1:A10 نطاق. يمكن تطبيق تنسيق أو دالة على نطاق."], ["3) Formula", "الصيغة تبدأ عادة بعلامة =، مثل =A1+B1. العمليات الحسابية الأساسية + و- و* و/. لا تكتب نتيجة يدوية إذا كان المطلوب حسابًا يمكن أن تتغير قيمه."], ["4) الدوال الأساسية", "SUM للجمع، AVERAGE للمتوسط، MAX لأكبر قيمة، MIN لأصغر قيمة، COUNT لعد الخلايا التي تحتوي أرقامًا."], ["5) المراجع النسبية والمطلقة", "A1 مرجع نسبي قد يتغير عند نسخ الصيغة. $A$1 مرجع مطلق ثابت. هذه الفكرة مهمة عندما تستخدم قيمة ثابتة مع عدة صفوف."], ["6) تنسيق البيانات", "يمكن تنسيق الأرقام كعملة أو نسبة أو تاريخ. التنسيق يغير طريقة العرض ولا يعني بالضرورة تغيير القيمة الأصلية."], ["7) Sort وFilter", "Sort يرتب السجلات. Filter يخفي مؤقتًا الصفوف التي لا تطابق الشرط. لا تخلط بين التصفية والحذف."], ["8) Charts", "Column للمقارنة، Line للتغير عبر الزمن، وPie لبعض النسب. اختر الرسم حسب نوع السؤال وليس حسب الشكل الجميل فقط."], ["9) الأخطاء", "#DIV/0! ينتج غالبًا من القسمة على صفر. أخطاء النتائج قد تنتج عن مرجع خاطئ أو نوع بيانات غير مناسب أو صيغة غير صحيحة."], ["10) مهارات الامتحان", "إذا طلب جمع مجموعة أرقام فكر SUM. متوسط فكر AVERAGE. أكبر قيمة MAX. أصغر MIN. ترتيب البيانات Sort. إظهار ما يطابق شرطًا Filter. عرض بصري Chart."]]}, {"title": "اليوم 6 — الأمان الرقمي", "en": "Cybersecurity, Privacy & Safety", "sections": [["1) لماذا الأمن مهم؟", "الهدف هو حماية Confidentiality وIntegrity وAvailability: سرية المعلومات، سلامتها، وإمكانية الوصول إليها عند الحاجة."], ["2) كلمات المرور", "استخدم كلمة مرور طويلة وفريدة لكل حساب. تجنب الاسم وتاريخ الميلاد والكلمات السهلة. مدير كلمات المرور يمكنه المساعدة في إنشاء كلمات مختلفة."], ["3) MFA", "Multi-Factor Authentication تضيف عامل تحقق إضافيًا. قد يكون تطبيق مصادقة أو مفتاح أمان أو رمز. لا تشارك رموز التحقق."], ["4) Phishing", "التصيد يحاول خداعك لتقديم معلومات أو فتح رابط أو ملف. علامات التحذير: استعجال، تهديد، جائزة غير متوقعة، عنوان غريب، أو رابط لا يطابق الجهة."], ["5) Malware", "Malware يشمل برامج ضارة مثل الفيروسات وبرامج التجسس وبرامج الفدية. لا تثبت برامج مجهولة أو مقرصنة."], ["6) التحديثات", "تحديث Windows والمتصفح والتطبيقات يساعد في إصلاح الثغرات. التأخير المستمر في التحديث يزيد المخاطر."], ["7) الخصوصية", "لا تنشر كلمات المرور أو رموز الدخول أو بيانات حساسة. راجع أذونات التطبيقات وإعدادات الخصوصية، واستخدم قفل الشاشة."], ["8) Backup", "النسخ الاحتياطي يساعد في استعادة الملفات بعد الحذف أو تلف الجهاز أو هجوم. احتفظ بنسخة منفصلة واختبر الاستعادة."], ["9) الحساب المخترق", "غيّر كلمة المرور من جهاز موثوق، فعّل MFA، أخرج الجلسات غير المعروفة، وراجع نشاط الحساب. لا تتعامل مع رسائل «الدعم» المجهولة كأنها رسمية."], ["10) أسئلة الامتحان", "إذا كان المطلوب منع سرقة الحساب فكر Password + MFA. إذا كانت رسالة تخدعك فكر Phishing. برنامج ضار Malware. استعادة ملفات Backup. حماية المعلومات Privacy."]]}, {"title": "اليوم 7 — المراجعة وحل المشكلات", "en": "Review, Troubleshooting & Practical ICT", "sections": [["1) مراجعة المصطلحات", "راجع Hardware/Software، CPU/RAM/Storage، Input/Output، OS/File/Folder، Internet/Web/Browser/Search Engine، Word/PowerPoint/Excel، Formula/Function، Phishing/Malware، Backup/MFA."], ["2) منهجية حل المشكلة", "حدد المشكلة، اجمع المعلومات، حدد ما تغير، جرّب الحل الأقل خطورة، اختبر النتيجة، ثم وثّق الحل. لا تغيّر عدة أشياء مرة واحدة إذا كنت تريد معرفة سبب المشكلة."], ["3) مشكلة الإنترنت", "افحص Wi‑Fi أو الكابل، تحقق من جهاز آخر، أعد الاتصال، ثم جرّب خطوات أكثر تقدمًا إذا لزم. إذا كانت كل الأجهزة متوقفة فالمشكلة قد تكون في الشبكة نفسها."], ["4) برنامج لا يستجيب", "انتظر لحظات، حاول حفظ العمل، أغلق البرنامج بطريقة طبيعية، واستخدم Task Manager إذا استمر التوقف. بعد ذلك افتح البرنامج واختبر."], ["5) ملف لا يفتح", "افحص الامتداد، البرنامج المناسب، حجم الملف، ومصدره. لا تغيّر الامتداد عشوائيًا. إذا كان الملف مهمًا، استخدم نسخة احتياطية."], ["6) مهارات الامتحان", "اقرأ السؤال كاملًا. الكلمات مثل «مؤقت» و«ذاكرة عمل» تشير إلى RAM. «جمع» إلى SUM. «متوسط» إلى AVERAGE. «نسخة مخفية» إلى BCC. «رابط احتيالي» إلى Phishing."], ["7) التفكير العملي", "لا تحفظ تعريفًا دون مثال. اسأل: ما المشكلة؟ أي أداة صممت لهذه المهمة؟ ما النتيجة المتوقعة؟ هذا الأسلوب يجعلك أفضل في الأسئلة الجديدة."], ["8) إدارة الوقت", "لا تعلق طويلًا على سؤال واحد. احذف الاختيارات الواضحة الخطأ، قارن الباقي، ثم اختر أفضل إجابة. راجع الأسئلة التي شككت فيها."], ["9) مراجعة الأخطاء", "بعد كل يوم اكتب المفاهيم التي أخطأت فيها. الخطأ نفسه فرصة لمعرفة نقطة الضعف. أعد السؤال بعد فترة بدل حفظ الإجابة فقط."], ["10) الاستعداد النهائي", "قبل الاختبار النهائي، راجع الاختصارات والامتدادات والفروق بين البرامج والدوال ومفاهيم الأمان. ثم حل الاختبار النهائي كاملًا دون الرجوع للدرس."]]}]; const QUESTIONS=[{"day": 0, "q": "ما وظيفة CPU؟", "a": "تنفيذ التعليمات والعمليات", "o": ["تنفيذ التعليمات والعمليات", "تخزين مؤقت للبيانات أثناء التشغيل", "حفظ البيانات والملفات", "الأجزاء المادية"]}, {"day": 0, "q": "ما وظيفة Storage؟", "a": "حفظ البيانات والملفات", "o": ["إدارة الملفات والمجلدات", "Ctrl+C", "Ctrl+V", "حفظ البيانات والملفات"]}, {"day": 0, "q": "ما المقصود بـ Software؟", "a": "البرامج والتعليمات", "o": [".docx", ".xlsx", "البرامج والتعليمات", "الحفظ باسم أو مكان أو صيغة مختلفة"]}, {"day": 0, "q": "ما وظيفة File Explorer؟", "a": "إدارة الملفات والمجلدات", "o": ["فتح واستخدام صفحات الويب", "إدارة الملفات والمجلدات", "شبكة عالمية من الشبكات", "خدمة تضم مواقع وصفحات"]}, {"day": 0, "q": "ما اختصار اللصق function renderDays(){document.getElementById('days').innerHTML=DAYS.map((d,i)=>`<div class="day ${i===current?'active':''}" onclick="selectDay(${i})"><b>${d.title}</b><br><span class="small">${state.done[i]}/50 سؤال</span></div>`).join('')}
function selectDay(i){current=i;renderDays();renderLesson();renderQuiz();document.getElementById('final').classList.add('hidden')}
function renderLesson(){let d=DAYS[current];let sec=d.sections.map(x=>`<h3>${x[0]}</h3><p>${x[1]}</p>`).join('');document.getElementById('lesson').innerHTML=`<span class="badge">${d.en}</span><h2>${d.title}</h2>${sec}<div class="tip"><b>مراجعة سريعة:</b> اقرأ كل النقاط ثم حل الـ50 سؤال بدون الرجوع للشرح.</div><p class="small">التقدم: ${state.done[current]} من 50</p><div class="progress"><div class="bar" style="width:${state.done[current]*2}%"></div></div>`}
function renderQuiz(){let qs=QUESTIONS.filter(x=>x.day===current);document.getElementById('quiz').innerHTML=`<h2>📝 أسئلة اليوم — 50 سؤال</h2><p class="small">الأسئلة مرتبطة بموضوعات الكورس. أكمل الخمسين قبل التصحيح.</p>`+qs.map((x,i)=>`<div class="q"><b>${i+1}. ${x.q}</b><div class="opts">${x.o.map(o=>`<label><input type="radio" name="q${i}" value="${o.replaceAll('"','&quot;')}"> ${o}</label>`).join('')}</div></div>`).join('')+`<button onclick="gradeDay()">تصحيح اليوم</button><div id="result"></div>`}
function gradeDay(){let qs=QUESTIONS.filter(x=>x.day===current),score=0,answered=0;qs.forEach((x,i)=>{let e=document.querySelector('input[name="q'+i+'"]:checked');if(e){answered++;if(e.value===x.a){score++;e.parentElement.classList.add('correct')}else e.parentElement.classList.add('wrong')}});if(answered<50){document.getElementById('result').innerHTML='<p>أجبت عن '+answered+' فقط. أكمل الـ50 سؤال.</p>';return}state.done[current]=50;state.scores[current]=score;save();renderDays();renderLesson();document.getElementById('result').innerHTML='<p class="score">نتيجتك: '+score+' / 50</p><p>'+(score>=45?'ممتاز جدًا 🔥':score>=40?'ممتاز 👍':score>=30?'جيد جدًا — راجع أخطاءك.':'راجع الدرس ثم أعد المحاولة 💪')+'</p>';if(state.done.every(x=>x===50))renderFinal()}
function renderFinal(){finalPool=[...QUESTIONS].sort(()=>Math.random()-.5).slice(0,100);let b=document.getElementById('final');b.classList.remove('hidden');b.innerHTML='<h2>🏆 الاختبار النهائي — 100 سؤال</h2><p>اختبار شامل لكل الأيام.</p>'+finalPool.map((x,i)=>`<div class="q"><b>${i+1}. ${x.q}</b><div class="opts">${x.o.map(o=>`<label><input type="radio" name="f${i}" value="${o.replaceAll('"','&quot;')}"> ${o}</label>`).join('')}</div></div>`).join('')+'<button onclick="gradeFinal()">تصحيح الاختبار النهائي</button><div id="finalResult"></div>';b.scrollIntoView({behavior:'smooth'})}
function gradeFinal(){let score=0,n=0;finalPool.forEach((x,i)=>{let e=document.querySelector('input[name="f'+i+'"]:checked');if(e){n++;if(e.value===x.a)score++}});if(n<100){document.getElementById('finalResult').innerHTML='<p>أجبت عن '+n+' فقط. أكمل الـ100 سؤال.</p>';return}state.final=score;save();document.getElementById('finalResult').innerHTML='<p class="score">🏆 النتيجة النهائية: '+score+' / 100</p><p>'+(score>=90?'ممتاز جدًا — جاهز! 🔥':score>=75?'جيد جدًا — راجع نقاط الضعف.':score>=60?'مقبول — تحتاج مراجعة.':'راجع الكورس وحاول مرة أخرى 💪')+'</p>'}
renderDays();renderLesson();renderQuiz();
</script></body></html>
